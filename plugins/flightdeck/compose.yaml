# flightdeck — 컨테이너 1개, 러너 0, 시크릿 0(설계 §2 Tier A).
#
# 띄우는 법:  docker compose up -d
# 보는 법:    http://<서버머신>:7420
# 세션 쪽:    export FD_URL=http://<서버머신>:7420

services:
  flightdeck:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: flightdeck:local
    container_name: flightdeck
    # ★ 컨테이너 크래시의 처방(설계 §7). 다만 재시작만으로는 부족하다 —
    #   포트 선점·DB 손상은 재시작해도 같은 자리에서 죽으므로,
    #   서버가 **사유를 남기고 종료**하고 그 줄이 `docker logs` 에 남는다.
    restart: unless-stopped
    # ★ api.ShutdownGrace(10초)보다 **커야 한다.** 같거나 작으면 유예를 다 쓴 종료가
    #   SIGKILL 과 같은 순간에 잘려서 "유예 안에 마무리를 못 했다" ERROR 조차 안 남는다 —
    #   정확히 그 줄이 필요한 상황에서 사라진다. docker 기본값이 10초라 부등식이 깨져 있었다.
    #   TestComposeStopGraceExceedsShutdownGrace 가 이 부등식을 붙든다.
    stop_grace_period: 20s
    # ★ 볼륨 주인의 uid 로 돈다. 이미지는 `USER nonroot`(65532)로 굳어 있는데 볼륨은
    #   호스트 사용자(보통 1000)의 것이라, 그대로 두면 DB 를 **열되 못 쓴다** —
    #   읽기는 되므로 기동은 성공하고, 첫 쓰기에서야 SQLite 가 readonly 로 죽는다.
    #   즉 실패가 기동 시점이 아니라 첫 세션 등록 시점에 나서 원인이 권한이라는 것이
    #   안 드러난다. uid 가 1000 이 아니면 FD_UID/FD_GID 를 준다(`id -u`·`id -g`).
    user: "${FD_UID:-1000}:${FD_GID:-1000}"
    ports:
      # 127.0.0.1 로 묶지 않는다: 다른 머신의 세션이 붙는 것이 이 제품의 전부다.
      # 대신 FD_TOKEN 을 주면 루프백 밖에서는 토큰이 필요해진다.
      - "7420:7420"
    volumes:
      # DB · 로그.
      - ~/.flightdeck:/data
      # ★ 판단 원장(설계 §7 의 "매시간 판단 백업"). **DB 와 다른 마운트다** — 백업 잡이
      #   생기는 시점에 가르기로 접어 뒀던 그 시점이 왔다(`fd serve` 안 티커가 매시간 쓴다).
      #
      #   **정직하게 적는다: 기본값은 여전히 같은 디스크다.** `~/.flightdeck-ledger` 는
      #   `~/.flightdeck` 의 형제일 뿐이라, 디스크가 통째로 죽으면 둘 다 잃는다.
      #   이 줄이 사는 것은 **가를 수 있는 자리**이지 분리 그 자체가 아니다 —
      #   진짜 분리는 FD_LEDGER_HOST 를 다른 매체로 겨눠야 성립한다(예: 외장 디스크·NAS).
      #
      #   ★ 호스트 쪽 이름(FD_LEDGER_HOST)과 컨테이너 쪽 이름(FD_LEDGER)을 **일부러 가른다.**
      #   한 이름을 양쪽에 쓰면 같은 낱말이 "어느 호스트 디렉토리인가"와 "컨테이너 안 어느
      #   경로인가"라는 다른 뜻이 되고, 그 혼동은 백업이 컨테이너 안에만 쌓일 때까지 안 보인다.
      - ${FD_LEDGER_HOST:-${HOME}/.flightdeck-ledger}:/ledger
      # ★ 저장소들. 파생(브랜치·sha·미커밋 발자국·경로 겹침)이 여기서 나온다 —
      #   없으면 서버는 200 을 내면서 보드에 `브랜치 ?(못 읽음)` 만 적는다.
      #
      #   **양쪽 경로가 같아야 한다.** 워크트리의 `.git` 은 파일이고 그 안에 주 저장소를
      #   가리키는 **절대경로**가 박혀 있다 — 컨테이너에서 다른 자리에 붙이면 그 링크가
      #   끊겨서, 주 저장소는 읽히는데 워크트리만 조용히 실패한다.
      #
      #   읽기 전용이다. 이 서버는 git 을 읽기만 한다(설계 §4 — 파생은 관측이지 조작이 아니다).
      - ${FD_REPOS:-${HOME}/cdo-dev}:${FD_REPOS:-${HOME}/cdo-dev}:ro
    environment:
      FD_ADDR: ":7420"
      FD_DB: "/data/fd.db"
      # 판단 원장이 착지하는 자리. 위 볼륨의 컨테이너 쪽 경로와 **같아야 한다** —
      # 어긋나면 잡은 컨테이너 안에만 쓰고 호스트에는 아무것도 안 남는다.
      FD_LEDGER: "/ledger"
      # 토큰을 비우면 인증이 꺼진다. **그 사실을 /healthz 가 알린다** —
      # 조용히 열어 두면 잠겨 있다고 믿는 상태로 노출된다.
      FD_TOKEN: "${FD_TOKEN:-}"
      FD_LOG: "${FD_LOG:-info}"
    healthcheck:
      # 이미지의 HEALTHCHECK 와 같은 판정이다. 여기 다시 적는 이유는
      # compose 로만 띄운 사람이 이미지 정의를 안 보기 때문이다.
      test: ["CMD", "/usr/local/bin/fd", "doctor"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
