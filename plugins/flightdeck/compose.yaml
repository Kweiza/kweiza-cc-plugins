# flightdeck — 서비스 2개(적용 one-shot + 서버), 러너 0, 시크릿 0(설계 §2 Tier A).
#
# ★ **두 단계인 이유**(2026-08-23, 설계 §7 처방 ①). 그전까지 스키마 적용은 store.Open() 안,
#   곧 `fd serve` 기동 경로에 있었다. 그래서 나쁜 증분은 "서버가 안 뜬다"로 나타났고
#   restart 정책이 그것을 무한히 되풀이했다 — §7 이 크래시루프라 부른 모양이다. 이제 적용은
#   아래 migrate 단계에서만 일어나고, 서버는 그것이 **성공으로 끝난 뒤에만** 뜬다.
#   적용이 실패하면 서버는 아예 안 뜨고 `docker compose logs migrate` 에 사유가 남으며,
#   되돌리기는 `fd migrate --rollback` 이다.
#
# 띄우는 법:  docker compose up -d
# 보는 법:    http://<서버머신>:7420
# 세션 쪽:    export FD_URL=http://<서버머신>:7420

services:
  # ★ 적용 단계. **이 서비스만 스키마를 바꾼다.**
  #
  # ★ restart: "no" 다. one-shot 은 끝나는 것이 정상이고, 재시작 정책을 걸면 성공한 적용을
  #   무한히 다시 돌린다(멱등이라 해가 없지만, 그 로그가 "무언가 반복 실패 중"으로 읽힌다).
  #
  # ★ container_name 을 주지 않는다. 이름을 고정하면 끝난 컨테이너가 자리를 물고 있어
  #   다음 `up` 이 이름 충돌로 멈춘다 — 갱신 경로가 정확히 그때 막힌다.
  #
  # ★ 저장소 마운트가 없다. 이 단계는 git 을 안 읽는다 — 스키마만 만진다.
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: flightdeck:local
    command: ["/usr/local/bin/fd", "migrate", "--db", "/data/fd.db"]
    restart: "no"
    # 서버와 **같은 uid** 로 돈다. 다르면 이 단계가 만든 파일을 서버가 못 쓴다.
    user: "${FD_UID:-1000}:${FD_GID:-1000}"
    volumes:
      - ~/.flightdeck:/data
    environment:
      FD_LOG: "${FD_LOG:-info}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  flightdeck:
    # ★ **service_completed_successfully 다.** 그냥 depends_on 은 "시작됐다"까지만 보므로
    #   적용이 실패해도 서버가 뜬다 — 그러면 이 단계를 둔 의미가 통째로 사라진다.
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: ./server
      dockerfile: Dockerfile
    image: flightdeck:local
    container_name: flightdeck
    # ★ 컨테이너 크래시의 처방(설계 §7). 다만 재시작만으로는 부족하다 —
    #   포트 선점·DB 손상은 재시작해도 같은 자리에서 죽으므로,
    #   서버가 **사유를 남기고 종료**하고 그 줄이 `docker logs` 에 남는다.
    restart: unless-stopped
    # ★ api.ShutdownGrace(10초)보다 **커야 한다.** 같거나 작으면 유예를 다 쓴 종료가
    #   SIGKILL 과 같은 순간에 잘려서 "유예 안에 마무리를 못 했다" ERROR 조차 안 남는다 —
    #   정확히 그 줄이 필요한 상황에서 사라진다. docker 기본값이 10초라 부등식이 깨져 있었다.
    #   TestComposeStopGraceExceedsShutdownGrace 가 이 부등식을 붙든다.
    stop_grace_period: 20s
    # ★ 볼륨 주인의 uid 로 돈다. 이미지는 `USER nonroot`(65532)로 굳어 있는데 볼륨은
    #   호스트 사용자(보통 1000)의 것이라, 그대로 두면 DB 를 **열되 못 쓴다** —
    #   읽기는 되므로 기동은 성공하고, 첫 쓰기에서야 SQLite 가 readonly 로 죽는다.
    #   즉 실패가 기동 시점이 아니라 첫 세션 등록 시점에 나서 원인이 권한이라는 것이
    #   안 드러난다. uid 가 1000 이 아니면 FD_UID/FD_GID 를 준다(`id -u`·`id -g`).
    user: "${FD_UID:-1000}:${FD_GID:-1000}"
    ports:
      # 127.0.0.1 로 묶지 않는다: 다른 머신의 세션이 붙는 것이 이 제품의 전부다.
      # 대신 FD_TOKEN 을 주면 루프백 밖에서는 토큰이 필요해진다.
      - "7420:7420"
    volumes:
      # DB · 로그.
      - ~/.flightdeck:/data
      # ★ 판단 원장(설계 §7 의 "매시간 판단 백업"). **DB 와 다른 마운트다** — 백업 잡이
      #   생기는 시점에 가르기로 접어 뒀던 그 시점이 왔다(`fd serve` 안 티커가 매시간 쓴다).
      #
      #   **정직하게 적는다: 기본값은 여전히 같은 디스크다.** `~/.flightdeck-ledger` 는
      #   `~/.flightdeck` 의 형제일 뿐이라, 디스크가 통째로 죽으면 둘 다 잃는다.
      #   이 줄이 사는 것은 **가를 수 있는 자리**이지 분리 그 자체가 아니다 —
      #   진짜 분리는 FD_LEDGER_HOST 를 다른 매체로 겨눠야 성립한다(예: 외장 디스크·NAS).
      #
      #   ★ 호스트 쪽 이름(FD_LEDGER_HOST)과 컨테이너 쪽 이름(FD_LEDGER)을 **일부러 가른다.**
      #   한 이름을 양쪽에 쓰면 같은 낱말이 "어느 호스트 디렉토리인가"와 "컨테이너 안 어느
      #   경로인가"라는 다른 뜻이 되고, 그 혼동은 백업이 컨테이너 안에만 쌓일 때까지 안 보인다.
      #
      #   이 자리에는 현재 세대(JSONL 여섯 + manifest.json)와 **역사**(journal.git, bare)가
      #   함께 산다. bare 라 작업 트리가 없다 — 그래서 되쓰기 가드(JudgeOutTarget)의
      #   관심사(작업본 오염)가 애초에 성립하지 않는다.
      - ${FD_LEDGER_HOST:-${HOME}/.flightdeck-ledger}:/ledger
      # ★ 저장소들. 파생(브랜치·sha·미커밋 발자국·경로 겹침)이 여기서 나온다 —
      #   없으면 서버는 200 을 내면서 보드에 `브랜치 ?(못 읽음)` 만 적는다.
      #
      #   **양쪽 경로가 같아야 한다.** 워크트리의 `.git` 은 파일이고 그 안에 주 저장소를
      #   가리키는 **절대경로**가 박혀 있다 — 컨테이너에서 다른 자리에 붙이면 그 링크가
      #   끊겨서, 주 저장소는 읽히는데 워크트리만 조용히 실패한다.
      #
      #   읽기 전용이다. 이 서버는 git 을 읽기만 한다(설계 §4 — 파생은 관측이지 조작이 아니다).
      #
      #   ★ **기본값은 홈이다(2026-08-22 개정).** 앞선 판은 홈 아래 `cdo-dev` 였고 그것은
      #   **한 머신의 관습**이었다 — 다른 머신에는 그 디렉토리가 아예 없고 저장소를 홈 바로
      #   아래 둔다. 실측(NAS): 등록 7건 중 **6건이 컨테이너에서 안 보였고** 파생 축이 전부
      #   미판정이었다. 그동안 healthz 는 ok 였다. 좁히고 싶으면 FD_REPOS 로 명시해라 —
      #   기본값이 틀려서 조용히 죽는 것보다, 넓게 붙이고 좁히는 쪽이 안전하다.
      #
      #   ★ **갱신할 때 이 값을 잃지 마라.** FD_REPOS 는 여기 치환 시점에만 쓰이고 컨테이너
      #   env 에도 안 남는다 — 흔적은 마운트뿐이다. 그래서 `up` 할 때 안 주면 조용히 기본값으로
      #   되돌아간다. 이전 값의 정본은 **돌고 있는 컨테이너의 ro 마운트**이고, down 하면 못
      #   읽으므로 **내리기 전에** 읽어야 한다(fd-update 스킬이 그 절차를 진다).
      #
      #   ★ **슬롯 넷이다(2026-08-22).** 루트가 하나뿐이면 저장소가 여러 트리에 흩어진 머신은
      #   공통 조상(=홈)을 통째로 붙이는 것 말고 선택지가 없고, 그러면 `.ssh`·`.claude` 까지 보인다.
      #   compose 는 **같은 경로의 중복 마운트를 자동으로 접으므로**, 안 쓰는 슬롯이 첫 슬롯으로
      #   접히게 두면 가변 개수가 필요 없다(실기동 검증: 두 슬롯으로 두 경로가 붙고 `.ssh` 는 안
      #   보였으며 빈 슬롯은 에러가 없었다). **콜론 구분은 안 된다** — 한 항목이 한 경로다.
      #   **상한은 넷이다.** 다섯째를 주면 조용히 안 붙는다 — 그 침묵이 이 축이 이미 한 번 낸 결함이다.
      - ${FD_REPOS:-${HOME}}:${FD_REPOS:-${HOME}}:ro
      - ${FD_REPOS2:-${FD_REPOS:-${HOME}}}:${FD_REPOS2:-${FD_REPOS:-${HOME}}}:ro
      - ${FD_REPOS3:-${FD_REPOS:-${HOME}}}:${FD_REPOS3:-${FD_REPOS:-${HOME}}}:ro
      - ${FD_REPOS4:-${FD_REPOS:-${HOME}}}:${FD_REPOS4:-${FD_REPOS:-${HOME}}}:ro
    environment:
      FD_ADDR: ":7420"
      FD_DB: "/data/fd.db"
      # 판단 원장이 착지하는 자리. 위 볼륨의 컨테이너 쪽 경로와 **같아야 한다** —
      # 어긋나면 잡은 컨테이너 안에만 쓰고 호스트에는 아무것도 안 남는다.
      FD_LEDGER: "/ledger"
      # 토큰을 비우면 인증이 꺼진다. **그 사실을 /healthz 가 알린다** —
      # 조용히 열어 두면 잠겨 있다고 믿는 상태로 노출된다.
      FD_TOKEN: "${FD_TOKEN:-}"
      FD_LOG: "${FD_LOG:-info}"
    healthcheck:
      # 이미지의 HEALTHCHECK 와 같은 판정이다. 여기 다시 적는 이유는
      # compose 로만 띄운 사람이 이미지 정의를 안 보기 때문이다.
      test: ["CMD", "/usr/local/bin/fd", "doctor"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
