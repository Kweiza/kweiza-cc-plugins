<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Context Platform — 진척 대시보드</title>
<link rel="stylesheet" href="deck.css" />
<style>
  body { background:#0B0B0C; color:var(--dm-fg-1); font-family:var(--font-sharp-body), system-ui;
         word-break:keep-all; margin:0; }
  .wrap { width:min(1180px, 94vw); margin:0 auto; padding:0 0 96px; }

  /* ── 상단 고정 머리 ── */
  header { position:sticky; top:0; z-index:20; background:rgba(11,11,12,.86); backdrop-filter:blur(14px);
           border-bottom:1px solid var(--dm-stroke); padding:18px 0 15px; margin-bottom:26px; }
  .hrow { width:min(1180px, 94vw); margin:0 auto; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .hrow h1 { font-family:var(--font-sharp); font-size:22px; font-weight:700; letter-spacing:-0.02em; margin:0; }
  .hrow .meta { font-size:12px; color:var(--dm-fg-3); margin-left:auto; text-align:right; line-height:1.55; }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--samsung-cobalt);
          background:rgba(56,122,255,.12); border-radius:14px; padding:4px 11px; }
  .live i { width:6px; height:6px; border-radius:50%; background:var(--samsung-cobalt); display:inline-block; }

  h2 { font-family:var(--font-sharp); font-size:15px; font-weight:700; letter-spacing:.02em;
       margin:38px 0 13px; display:flex; align-items:baseline; gap:10px; }
  h2 small { font-size:11.5px; font-weight:400; color:var(--dm-fg-3); letter-spacing:0; }

  .card { background:var(--dm-container); border-radius:20px; padding:18px 22px;
          outline:1px solid var(--dm-stroke); }
  .grid { display:grid; gap:12px; }

  /* ── 요약 타일 ── */
  .tiles { grid-template-columns:repeat(4, 1fr); }
  .tile .k { font-size:11px; color:var(--dm-fg-3); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .tile .v { font-family:var(--font-sharp); font-size:34px; font-weight:700; line-height:1.1; margin-top:7px;
             font-variant-numeric:tabular-nums; }
  .tile .s { font-size:11.5px; color:var(--dm-fg-3); margin-top:4px; line-height:1.5; }

  /* ── 세션 카드 ── */
  .sess { grid-template-columns:repeat(2, 1fr); }
  .sess .card { display:flex; flex-direction:column; gap:9px; }
  .sess .top { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .sess .tno { font-family:var(--font-sharp); font-size:15px; font-weight:700; }
  .sess .ttl { font-size:12.5px; color:var(--dm-fg-2); }
  .sess .br { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:10.5px; color:var(--dm-fg-3);
              margin-left:auto; white-space:nowrap; }
  .ago { cursor:help; }                      /* title 에 절대 시각(KST) */
  .ago.bad { color:#FFB59A; font-weight:700; }
  .sess dl { margin:0; display:grid; grid-template-columns:60px 1fr; gap:4px 10px; }
  .sess dt { font-size:10.5px; font-weight:700; color:var(--dm-fg-3); padding-top:1px; }
  .sess dd { margin:0; font-size:12px; color:var(--dm-fg-2); line-height:1.55; }
  .sess dd.warn { color:#FFB59A; }
  .sess .lin { font-size:11px; color:var(--dm-fg-3); line-height:1.65;
               border-left:2px solid rgba(255,255,255,.12); padding-left:8px; }
  .sess .lin b { color:var(--dm-fg-2); font-weight:600; }

  /* 연속 세션 묶음 — 한 카드 안에서 이전/다음으로 갈아 끼운다 */
  .sess .ver { display:flex; flex-direction:column; gap:9px; }
  .sess .ver[hidden] { display:none; }
  .sess .nav { display:flex; align-items:center; gap:8px; }
  .sess .nb { font-family:inherit; font-size:10.5px; font-weight:700; color:var(--dm-fg-2);
              background:rgba(255,255,255,.07); border:0; border-radius:11px; padding:3px 10px; cursor:pointer; }
  .sess .nb:hover:not(:disabled) { background:rgba(255,255,255,.14); }
  .sess .nb:disabled { color:var(--dm-fg-3); opacity:.35; cursor:default; }
  .sess .pos { font-size:10.5px; color:var(--dm-fg-3); }

  /* 끝났고 후속도 없는 세션 — 접어 둔다 */
  .fold { margin-top:12px; }
  .fold > summary { cursor:pointer; list-style:none; font-size:11.5px; color:var(--dm-fg-3);
                    background:var(--dm-container); border-radius:14px; padding:11px 16px;
                    outline:1px solid var(--dm-stroke); user-select:none; }
  .fold > summary::-webkit-details-marker { display:none; }
  .fold > summary::before { content:'▸  '; }
  .fold[open] > summary::before { content:'▾  '; }
  .fold > summary:hover { color:var(--dm-fg-2); }
  .fold > .sess { margin-top:12px; }

  .banner { border-color:rgba(231,105,49,.45); background:rgba(231,105,49,.08);
            font-size:12px; color:#FFB59A; line-height:1.7; margin-bottom:12px; }
  .banner b { color:#FFD1BC; }
  .banner .s { display:block; margin-top:4px; font-size:11px; color:var(--dm-fg-3); }

  .pill { border-radius:12px; padding:2px 9px; font-size:10.5px; font-weight:700; white-space:nowrap; }
  .pill.run  { background:rgba(56,122,255,.16); color:#8FB4FF; }
  .pill.blk  { background:rgba(231,105,49,.16); color:#FFA97F; }
  .pill.non  { background:rgba(255,255,255,.07); color:var(--dm-fg-3); }
  .pill.hold { background:rgba(239,180,32,.14); color:#F2CE6A; }
  .pill.done { background:rgba(59,209,139,.14); color:#7FE3B6; }

  /* ── 파트 진행 ── */
  .parts { grid-template-columns:repeat(2, 1fr); gap:9px; }
  .prow { display:grid; grid-template-columns:1fr 120px 50px; align-items:center; gap:13px;
          background:var(--dm-container); border-radius:14px; padding:10px 15px; outline:1px solid var(--dm-stroke); }
  .prow .pn { font-size:12.5px; font-weight:700; }
  .prow .po { font-size:10.5px; color:var(--dm-fg-3); margin-top:2px; }
  .prow .pv { font-family:var(--font-sharp); font-size:16px; font-weight:700; text-align:right;
              font-variant-numeric:tabular-nums; }
  .prow .pv small { font-size:10px; font-weight:400; color:var(--dm-fg-3); }
  .bar { height:6px; border-radius:4px; background:#2A2A2F; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:4px; background:var(--samsung-cobalt); }
  .bar.blk > i { background:var(--status-orange); }
  .bar.idle > i { background:#4A4A52; }
  .delta { grid-column:1 / -1; font-size:10.5px; color:#8FB4FF; margin-top:6px;
           padding-top:6px; border-top:1px solid var(--dm-divider); }

  /* ── 타임라인 ── */
  .tl { position:relative; padding-left:20px; }
  .tl::before { content:''; position:absolute; left:4px; top:6px; bottom:6px; width:1px; background:var(--dm-stroke); }
  .tl .it { position:relative; padding:0 0 15px; }
  .tl .it::before { content:''; position:absolute; left:-19px; top:5px; width:7px; height:7px; border-radius:50%;
                    background:var(--samsung-cobalt); outline:3px solid #0B0B0C; }
  .tl .it.q::before { background:#4A4A52; }
  .tl .d { font-size:10.5px; color:var(--dm-fg-3); font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tl .t { font-size:12.5px; font-weight:700; margin-top:2px; }
  .tl .n { font-size:11.5px; color:var(--dm-fg-3); line-height:1.55; margin-top:3px; }

  /* ── 막힘 ── */
  .blk3 { grid-template-columns:repeat(3, 1fr); }
  .blk3 .card { display:flex; flex-direction:column; gap:11px; }
  .bhd { font-family:var(--font-sharp); font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .bhd span.c { font-size:10.5px; font-weight:400; color:var(--dm-fg-3); }
  .bit { border-top:1px solid var(--dm-divider); padding-top:9px; }
  .bit b { font-size:12px; display:block; }
  .bit p { margin:3px 0 0; font-size:11.2px; color:var(--dm-fg-3); line-height:1.55; }

  .note { font-size:11.5px; color:var(--dm-fg-3); line-height:1.7; }
  .note b { color:var(--dm-fg-2); }
  .mn { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--dm-fg-2); }
  a { color:var(--samsung-cobalt); }

  @media (max-width:900px) {
    .tiles, .sess, .parts, .blk3 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>개발 진척 대시보드</h1>
    <span class="live"><i></i>등록·핸드오프마다 갱신</span>
    <nav style="display:flex; gap:14px; font-size:12px;">
      <a href="progress.html">진척 덱 →</a><a href="index.html" style="color:var(--dm-fg-3);">덱 목록</a>
    </nav>
    <div class="meta" id="hmeta"></div>
  </div>
</header>

<div class="wrap">
  <div class="grid tiles" id="tiles"></div>

  <h2>세션 현황 <small>게시판(<span class="mn">tools/session-board.sh show</span>)의 스냅숏 — 실시간 정본은 게시판입니다</small></h2>
  <div id="sessWarn"></div>
  <div class="grid sess" id="sessions"></div>
  <div id="sessDone"></div>
  <div id="locks" style="margin-top:12px;"></div>

  <h2>작업 큐 <small id="queueNote"></small></h2>
  <div id="queueWarn"></div>
  <div class="grid blk3" id="queue"></div>

  <h2>파트별 진행 <small id="judgedNote"></small></h2>
  <div class="grid parts" id="parts"></div>
  <div class="card" style="margin-top:12px;">
    <div class="note" id="partsNote"></div>
  </div>

  <h2>랜딩 이력 <small>핸드오프 단위 · 최근순</small></h2>
  <div class="card"><div class="tl" id="timeline"></div></div>

  <h2>열린 막힘 <small id="blkNote"></small></h2>
  <div class="grid blk3" id="blockers"></div>

  <h2>이 문서를 갱신하는 법</h2>
  <div class="card"><div class="note" id="howto"></div></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   여기부터 DATA 블록만 고치면 됩니다. 세션이 등록할 때와 해제할 때 갱신합니다.
   갱신 절차는 페이지 맨 아래 "이 문서를 갱신하는 법"에 있습니다.

   원칙 하나만 지키면 됩니다 —
   **parts[].pct 는 전수 판정일의 값이고 손으로 올리지 않습니다.**
   그 뒤 main에 랜딩된 변화는 parts[].delta 에 문장으로 적습니다.
   진행률을 손으로 올리면 근거 없는 숫자가 되고, 그러면 이 표를 아무도 못 믿습니다.
   ═══════════════════════════════════════════════════════════════════════ */
const DATA = {
  // 시각은 전부 KST(+09:00) 기준의 'YYYY-MM-DD HH:MM'. "N분 전"은 페이지가 계산하므로 적지 않습니다.
  asOf: '2026-08-03 18:40',

  code: {
    main: '7f703a0',
    subject: 'Let e2e run with a resident platform-admin present',
    commits: 422,
    since: '2026-07-26',
  },

  // 마지막 전수 판정 — progress.html 덱을 만들 때 코드로 판정한 값
  judged: { at: '2026-08-03', sha: '76cffa6', deck: 'progress.html', items: 137, done: 56, partial: 60, none: 21 },

  // 게시판 스냅숏. state: run(진행 중) | blk(막힘) | hold(대기) | done(핸드오프 완료) | non
  //
  // at — **그 카드를 마지막으로 쓴 시각**(KST). "방금"·"10분 전" 같은 상대시간은 적지 않습니다 —
  //      화면의 "N분 전"은 이 값에서 계산하므로, 하드코딩하면 카드가 늙어도 영원히 "방금"입니다.
  //      진행 중(state: 'run')인데 120분 넘게 갱신이 없으면 그 자리에 ⚠ 무갱신이 뜹니다.
  //
  // next — 이 세션에서 나온 후속 작업. **없으면 빈 문자열('')을 적습니다** — 그러면 그 카드는
  //        state: 'done' 일 때 "후속 없이 끝난 세션"으로 접힙니다. "없음"이라고 문장으로 적으면
  //        후속이 있는 것으로 취급돼 계속 펼쳐져 있습니다(문구를 읽어 판정하지 않기 때문입니다).
  //        그렇게 적으면 **세션 현황 위에 ⚠ 경고가 뜨고 그 카드의 '다음' 칸에도 표시가 붙습니다** —
  //        규율을 주석에만 두었더니 아무도 못 지켰고, 카드가 표시 없이 틀린 자리에 놓였습니다.
  //
  // prev — 앞 세션의 일을 이어받았으면 그 세션의 branch 를 적습니다(트랙이 달라도 됩니다).
  //        이어받은 게 아니면 prev: null 을 적습니다. **안 적으면** 같은 트랙 카드가
  //        2장 이상일 때 세션 현황 위에 경고가 뜹니다 — 연속 세션이 조용히 갈라지는 것을 막습니다.
  //        이어진 세션들은 **카드 한 장으로 묶여 최신만 보이고**, 카드 안의 이전/다음으로 넘겨 봅니다.
  sessions: [
    { track: 'dash-syntax', title: '이 페이지가 백지였던 것 — status.html 구문 오류로 스크립트가 통째로 죽어 있었다',
      state: 'done', label: '랜딩 후 종료 · 문서 레포만',
      branch: 'docs-dash-syntax', prev: null, head: '235682d', at: '2026-07-31 11:11',
      now: '**사용자가 "대시보드에 왜 아무것도 안 보이지"라고 물어 착수했습니다**(큐 항목 없이 돈 세션입니다). 이 페이지의 **인라인 스크립트**가 구문 오류로 파싱 자체에 실패해 본문이 한 줄도 그려지지 않고 있었습니다. 헤드리스 크롬 실측: **수정 전 본문 147자 · 컨테이너 6종 전부 빈칸 → 수정 후 74,569자 · 전부 채움**(배포 URL 재확인 74,567자, 페이지 오류는 favicon 404 하나뿐). 깨진 자리는 셋이고 전부 DATA 블록의 **문자열 리터럴**입니다 — `b:` 값 안에서 문단을 줄바꿈해 이어 붙인 곳 둘(작은따옴표 문자열은 줄을 넘지 못합니다)과, 본문에 ASCII 작은따옴표를 그대로 넣어 문자열이 거기서 끊긴 곳 하나. **텍스트는 한 글자도 안 바꿨습니다** — 공백·이스케이프를 정규화한 뒤 옛/새 전문을 기계로 대조해 동일함을 확인했고, 이 랜딩의 diff 는 공백과 이스케이프뿐입니다. **언제부터인지는 추정이 아니라 전수 판정입니다**: 이 파일의 이력 65건을 거꾸로 파싱해 `1683e64`(2026-07-30 21:37)가 첫 깨짐이고 그 앞 `fffdb29`는 통과함을 확인했습니다. 그 뒤 이 파일을 고친 커밋 **12건이 전부 백지인 채 랜딩**됐습니다. **이 건의 무게는 구문 오류가 아니라 게이트가 있는데 통과했다는 데 있습니다** — pre-commit 규칙 3-a 가 스테이징된 파일로 렌더 시험을 돌리는데, 그 시험이 "DATA 블록 끝" 주석에서 파일을 갈라 **그리기 절반만** 실행하고 데이터는 픽스처로 갈아 끼웁니다. 그래서 **파일의 나머지 절반(DATA 약 500줄)이 어떤 검사도 안 받고 있었습니다.** **인라인 스크립트 전체**의 구문만 보는 단정을 신설했고(내용은 안 봅니다 — 그것을 단정하면 픽스처를 쓰는 이유였던 문제를 그대로 되들여옵니다), 수정 전 실물 파일에 걸어 **빨간불과 파일 행 번호 691** 까지 확인했습니다. **같은 자리에서 시험의 경계 판정도 닫았습니다** — 이 카드를 쓰자 시험 23건이 한꺼번에 깨졌는데, 원인은 시험이 데이터/그리기 경계를 **부분 문자열**로 찾아 **카드가 그 문구를 인용한 것만으로** 경계가 DATA 한복판(스크립트 45행)으로 올라간 것이었습니다. 줄 전체로 찾고 **정확히 하나**일 것을 요구하도록 고쳤고(정상 경계는 563행), 이 카드가 그대로 살아 있는 회귀 사례가 됩니다. 문서 레포 랜딩 `d89962b` + 이 커밋. 코드 레포는 한 줄도 안 바뀌어 `landings`·`delta`·`pct` 는 건드리지 않았습니다(`dash-live` 선례).',
      next: '① 큐 `dash-real-data-render` — **구문은 이제 막히지만 런타임은 여전히 안 보입니다.** 실 DATA 로 한 번 그려 보고 컨테이너가 비지 않았는지만 확인하는 축이 남았습니다. ② 항목으로 만들지 않은 관찰 하나: **12커밋 동안 아무도 이 페이지를 열어 보지 않았습니다.** 갱신 절차(맨 아래 "이 문서를 갱신하는 법")에 "열어서 확인한다"가 없고 지금도 없습니다 — 사람 규율로 넣을지 기계로 대신할지(①이 그쪽입니다)는 판단이 필요해 항목으로 만들지 않았습니다. ③ 큐 `dash-blocker-qid-stale` — 이 페이지가 스스로 띄우는 **끊긴 큐 포인터** 경고 둘(`contracts-console-api`·`contracts-feedback-surface` 가 이미 done). 이 랜딩 전부터 있던 것이고 계약 트랙 좌표라 여기서 고치지 않았습니다. ④ 깨진 12커밋의 **내용**은 검토하지 않았습니다 — 파싱이 되니 데이터는 살아 있고, "안 보였다"와 "틀렸다"는 다른 축입니다.',

    { at: '2026-07-31 02:47', title: '신뢰도 서빙(§5.2) 단정을 질의 파싱으로 — 부분 문자열이 13종 변이를 살리고 있었다', commit: '6210d6b',
      note: '**전 시험을 통과하면서 §5.2 를 무너뜨리는 변이가 13종이었다.** 앞 세션이 격리(§3.2) 축을 파싱으로 푼 뒤 신뢰도 축을 "아직 부분 문자열"이라 자백하며 남겨 뒀는데, 그 구멍의 크기가 이번에 실측됐다. 최악형은 status 절을 `must_not` 아래로 옮기는 것 — 기본 검색이 **오직 exploratory·deprecated·archived 만** 반환하는데도 초록이었다. `must_not` 아래로 못 가게 하는 것만이 아니다: 기본 셋에 `exploratory` 를 더해도(Contains 는 존재만 본다), T2 필터를 **통째로 지워도**(부정 단정뿐이라), 필드명만 `status`→`trust_level` 로 바꿔도(아무 문서도 안 맞아 상시 0건인데 200 이라 장애로 안 읽힌다) 전부 초록이었다. **`status` 절은 `tenant` 와 구조가 달라 축이 하나 성립하지 않는다** — 단일 term/terms 라 `minimum_should_match` 가 아예 없어 **위치만이 구속력을 정한다.** 그 자리를 절의 **형태**(term/terms)를 기대값에 담는 것으로 메웠다(엔진이 둘을 다르게 파싱하므로 소비자에게 보이는 차이다). 검증은 격리 워크트리 5그룹 병렬 + 6종 직접 재현이고, **대조군이 값을 했다**: 그 워크트리들이 랜딩 커밋이 아니라 main 에서 나서 세 그룹이 처음에 대상 파일이 **없는** 트리를 초록으로 보고했다 — "대조군이 자기 전제를 증명하게 하라"를 안 넣었으면 13종 전부가 거짓 초록이 됐다. **리뷰가 내가 새로 쓴 주석 셋이 거짓임을 잡았다**(이 레포의 "정정이 새 거짓을 심는다" 재실증): 그중 하나는 `isolation_test.go` 의 무조건 서술("should 아래면 가점 힌트")을 **새 파일로 복제한 것**인데, 그 bool 이 msm 을 1로 명시하면 구속이고 **반례가 운영 코드 자신**이다(테넌트 필터가 그 형태다). 셋 다 고쳤고 원본 자리는 큐로 이연했다. 리뷰가 실증한 쉼표 구분자 구멍(`["confirmed,in_progress"]` 단일 원소가 두 원소 집합과 같은 표기가 되어 조용히 통과)도 닫았다. 판정 함수를 직접 부르는 픽스처를 신설해 위치 축 분기가 CI 에서 실행되게 했다 — 그전까지 그 분기의 유일한 근거가 1회성 변이 주입이었다. 시험 211→229. **런타임 무변경이라 e2e 생략**(변경 파일이 `_test.go` 둘뿐).' },

넌트 축 — **인박스 전결 경로의 선행은 아닙니다**) · `t7-alert-detection-point`.\n\n**기각한 대안과 이유는 D-0026 대안 표에 있습니다** — 콘솔 계정에 업무 테이블 GRANT(울타리 첫 예외) · 전용 스키마 GRANT(저장 위치로 표면 소속을 대신 정하는 형태) · 스튜어드 전결 경로만 먼저(알파에 서비스 계정 JWT 가 없어 **콘솔이 테넌트별 고정 토큰을 전부 쥐어야 하는 시크릿 팬아웃**) · dedupe 키에 신고자 축(알파는 테넌트당 계정 1개라 판별력이 낮습니다).' },
